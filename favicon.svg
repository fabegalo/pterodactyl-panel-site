<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The app's hexagon on its own. The full icon carries three sliders and an
       outlined pterodactyl too, which is right at launcher size and turns to
       mush in a 16px browser tab. -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B93FD" />
      <stop offset="1" stop-color="#0B3F92" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="102" fill="url(#field)" />
  <path
    d="M434 256 L345 410 L167 410 L78 256 L167 102 L345 102 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="52"
    stroke-linejoin="round"
  />
</svg>
